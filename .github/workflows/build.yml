name: Build libbox

on:
  push:
    branches: [ "main" ]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.22"

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential

      - name: Clone source
        run: |
          git clone https://github.com/SagerNet/sing-box.git

      - name: Build libbox
        run: |
          cd sing-box
          go mod tidy
          go build -o libbox ./cmd/sing-box

      - name: Check build output
        run: |
          ls -lah sing-box

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: libbox-aar
          path: '**/*.aar'
