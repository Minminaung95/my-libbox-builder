name: Build libbox AAR

on:
  push:
    branches: [ main, testing ]
    tags:
      - 'v*'
  pull_request:
    branches: [ main ]
  workflow_dispatch:
    inputs:
      version:
        description: 'sing-box branch or tag (e.g. v1.13.1), empty = testing branch'
        required: false
        default: ''

jobs:
  build-libbox:
    name: Build libbox.aar
    runs-on: ubuntu-latest

    steps:
      - name: Checkout sing-box
        uses: actions/checkout@v4
        with:
          repository: SagerNet/sing-box
          ref: ${{ github.event.inputs.version || 'testing' }}
          fetch-depth: 0

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version-file: 'go.mod'
          cache: true

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Android NDK
        uses: nttld/setup-ndk@v1
        id: setup-ndk
        with:
          ndk-version: r26d
          add-to-path: true

      - name: Install gomobile
        run: |
          go install github.com/sagernet/gomobile/cmd/gomobile@latest
          go install github.com/sagernet/gomobile/cmd/gobind@latest
          gomobile init

      - name: Install dependencies
        run: |
          go mod download

      - name: Build libbox.aar
        env:
          ANDROID_NDK_HOME: ${{ steps.setup-ndk.outputs.ndk-path }}
        run: |
          mkdir -p output
          go run ./cmd/internal/build_libbox \
            -target android \
            -outdir ./output

      - name: Rename output with version
        run: |
          VERSION=$(git describe --tags --always)
          mv output/libbox.aar output/libbox-${VERSION}.aar
          echo "AAR_FILE=output/libbox-${VERSION}.aar" >> $GITHUB_ENV
          echo "VERSION=${VERSION}" >> $GITHUB_ENV

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: libbox-${{ env.VERSION }}
          path: ${{ env.AAR_FILE }}
          retention-days: 30

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ env.AAR_FILE }}
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
