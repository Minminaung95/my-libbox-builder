name: Build libbox AAR

on:
  workflow_dispatch:

jobs:
  build-libbox:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout sing-box
        uses: actions/checkout@v4
        with:
          repository: SagerNet/sing-box
          ref: 'v1.13.8' # <--- ဒီတစ်ခါ တကယ်ရှိတဲ့ Version အစစ်ကို သေချာထည့်ထားပါတယ်
          fetch-depth: 0

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.22'
          cache: true

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Android NDK
        uses: nttld/setup-ndk@v1
        id: setup-ndk
        with:
          ndk-version: r25c
          add-to-path: true

      - name: Install gomobile (SagerNet Tool)
        run: |
          go install -v github.com/sagernet/gomobile/cmd/gomobile@v0.1.12
          go install -v github.com/sagernet/gomobile/cmd/gobind@v0.1.12
          export PATH=$PATH:$(go env GOPATH)/bin
          gomobile init

      - name: Build libbox.aar
        env:
          ANDROID_NDK_HOME: ${{ steps.setup-ndk.outputs.ndk-path }}
        run: |
          export PATH=$PATH:$(go env GOPATH)/bin
          gomobile bind -v -target=android -androidapi 21 -javapkg=io.nekohasekai -tags with_quic,with_grpc,with_wireguard,with_utls,with_reality,with_clash_api,with_gvisor -o libbox.aar ./experimental/libbox

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: libbox-v1.13.8-aar
          path: libbox.aar
