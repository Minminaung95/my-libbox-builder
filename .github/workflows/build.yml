name: Build libbox AAR

on:
  workflow_dispatch:

jobs:
  build-libbox:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout sing-box
        uses: actions/checkout@v4
        with:
          repository: SagerNet/sing-box
          ref: 'v1.18.8' # Hysteria2 အပြည့်အဝပါတဲ့ ဗားရှင်းပါ
          fetch-depth: 0

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.22'
          cache: true

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Android NDK
        uses: nttld/setup-ndk@v1
        id: setup-ndk
        with:
          ndk-version: r25c # Cronet Error မတက်အောင်ပါ
          add-to-path: true

      - name: Install gomobile
        run: |
          # ဒီနေရာက အရေးအကြီးဆုံးပါပဲ။ SagerNet ရဲ့ Tool ကိုသုံးမှ Error မတက်မှာပါ
          go install -v github.com/sagernet/gomobile/cmd/gomobile@v0.1.12
          go install -v github.com/sagernet/gomobile/cmd/gobind@v0.1.12
          export PATH=$PATH:$(go env GOPATH)/bin
          gomobile init

      - name: Build libbox.aar
        env:
          ANDROID_NDK_HOME: ${{ steps.setup-ndk.outputs.ndk-path }}
        run: |
          export PATH=$PATH:$(go env GOPATH)/bin
          # SagerNet ရဲ့ မူရင်း Build Script ကို တိုက်ရိုက် သုံးလိုက်ပါပြီ
          go run ./cmd/internal/build_libbox -target android

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: libbox-aar
          path: '*.aar' # ထွက်လာတဲ့ aar ဖိုင်ကို အပြင်ထုတ်ပေးပါမယ်
