# .github/workflows/build.yml
name: Build libbox AAR

on:
  push:
    branches: [ main, dev-next ]
    tags:
      - 'v*'
  pull_request:
    branches: [ main ]
  workflow_dispatch:
    inputs:
      version:
        description: 'sing-box version tag (e.g. v1.12.0), empty = latest'
        required: false
        default: ''

jobs:
  build-libbox:
    name: Build libbox.aar
    runs-on: ubuntu-latest

    steps:
      # ─── 1. Checkout sing-box source ───────────────────────────────────────
      - name: Checkout sing-box
        uses: actions/checkout@v4
        with:
          repository: SagerNet/sing-box
          ref: ${{ github.event.inputs.version || 'dev-next' }}
          fetch-depth: 0

      # ─── 2. Setup Go (version from go.mod) ─────────────────────────────────
      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version-file: 'go.mod'
          cache: true

      # ─── 3. Setup Java (gomobile needs JDK) ────────────────────────────────
      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      # ─── 4. Setup Android NDK ───────────────────────────────────────────────
      - name: Setup Android NDK
        uses: nttld/setup-ndk@v1
        id: setup-ndk
        with:
          ndk-version: r26d
          add-to-path: true

      # ─── 5. Install gomobile (sagernet fork) ────────────────────────────────
      - name: Install gomobile
        run: |
          go install github.com/sagernet/gomobile/cmd/gomobile@latest
          go install github.com/sagernet/gomobile/cmd/gobind@latest
          gomobile init

      # ─── 6. Install build dependencies ─────────────────────────────────────
      - name: Install dependencies
        run: |
          go get github.com/sagernet/gomobile@latest
          go mod download

      # ─── 7. Build libbox.aar ────────────────────────────────────────────────
      - name: Build libbox.aar
        env:
          ANDROID_NDK_HOME: ${{ steps.setup-ndk.outputs.ndk-path }}
        run: |
          mkdir -p output
          go run ./cmd/internal/build_libbox \
            -target android \
            -outdir ./output

      # ─── 8. Rename with version tag ─────────────────────────────────────────
      - name: Rename output
        run: |
          VERSION=$(git describe --tags --always)
          mv output/libbox.aar output/libbox-${VERSION}.aar
          echo "AAR_FILE=output/libbox-${VERSION}.aar" >> $GITHUB_ENV
          echo "VERSION=${VERSION}" >> $GITHUB_ENV

      # ─── 9. Upload artifact ─────────────────────────────────────────────────
      - name: Upload libbox.aar
        uses: actions/upload-artifact@v4
        with:
          name: libbox-${{ env.VERSION }}
          path: ${{ env.AAR_FILE }}
          retention-days: 30

      # ─── 10. Create GitHub Release (tag push မှသာ) ──────────────────────────
      - name: Create Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ env.AAR_FILE }}
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
