name: Build libbox AAR

on:
  workflow_dispatch: # ဘာမှရိုက်စရာမလိုဘဲ ခလုတ်နှိပ်ရုံနဲ့ Build ပါမယ်

jobs:
  build-libbox:
    name: Build libbox.aar
    runs-on: ubuntu-latest

    steps:
      - name: Checkout sing-box
        uses: actions/checkout@v4
        with:
          repository: SagerNet/sing-box
          ref: 'v1.18.8' # အလုပ်လုပ်တာ သေချာတဲ့ version ကို တိုက်ရိုက် သတ်မှတ်လိုက်ပါပြီ
          fetch-depth: 0

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.21.13'
          cache: true

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Android NDK
        uses: nttld/setup-ndk@v1
        id: setup-ndk
        with:
          ndk-version: r25c
          add-to-path: true

      - name: Install gomobile
        run: |
          go install -v github.com/sagernet/gomobile/cmd/gomobile@v0.1.12
          go install -v github.com/sagernet/gomobile/cmd/gobind@v0.1.12
          export PATH=$PATH:$(go env GOPATH)/bin
          gomobile init

      - name: Build libbox.aar
        env:
          ANDROID_NDK_HOME: ${{ steps.setup-ndk.outputs.ndk-path }}
        run: |
          export PATH=$PATH:$(go env GOPATH)/bin
          # Linker Error မတက်အောင် ရှင်းလင်းတဲ့ build စာကြောင်းကို သုံးပါမယ်
          gomobile bind -v -target=android -androidapi 21 -javapkg=io.nekohasekai -tags with_quic,with_grpc,with_wireguard,with_utls,with_reality,with_clash_api,with_gvisor -o libbox.aar ./experimental/libbox

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: libbox-aar
          path: libbox.aar
