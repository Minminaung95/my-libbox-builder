name: Build libbox AAR

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: 1.22

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential unzip git

      - name: Install Android NDK
        run: |
          wget https://dl.google.com/android/repository/android-ndk-r26d-linux.zip
          unzip android-ndk-r26d-linux.zip
          echo "ANDROID_NDK_HOME=$PWD/android-ndk-r26d" >> $GITHUB_ENV
          echo "$PWD/android-ndk-r26d/toolchains/llvm/prebuilt/linux-x86_64/bin" >> $GITHUB_PATH

      - name: Install gomobile
        run: |
          go install golang.org/x/mobile/cmd/gomobile@latest
          gomobile init

      - name: Clone sing-box
        run: |
          git clone https://github.com/SagerNet/sing-box.git

      - name: Build libbox AAR (IMPORTANT)
        run: |
          cd sing-box
          make clean || true
          make libbox

      - name: Debug output
        run: |
          find sing-box -name "*.aar" || true

      - name: Upload AAR
        uses: actions/upload-artifact@v4
        with:
          name: libbox-aar
          path: |
            sing-box/**/*.aar
