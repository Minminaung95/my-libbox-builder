name: Build libbox AAR

on: 
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Stable Source
        uses: actions/checkout@v4
        with:
          repository: SagerNet/sing-box
          ref: 'refs/tags/v1.18.8' # Tag ကို တိုက်ရိုက်ခေါ်တဲ့ နည်းလမ်းဖြစ်လို့ လုံးဝ မလွဲတော့ပါဘူး
          fetch-depth: 1

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.21.13'

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Build Engine
        run: |
          # gomobile သွင်းမယ်
          go install golang.org/x/mobile/cmd/gomobile@latest
          go install golang.org/x/mobile/cmd/gobind@latest
          export PATH=$PATH:$(go env GOPATH)/bin
          gomobile init
          
          # လိုအပ်တဲ့ Bind package ကို သေချာ ခေါ်မယ်
          go get golang.org/x/mobile/bind
          
          # အင်ဂျင်ကို ထုတ်မယ် (with_gvisor ပါ ထည့်ပေးထားပါတယ်)
          gomobile bind -v -target=android -androidapi 21 -javapkg=io.nekohasekai -tags with_quic,with_grpc,with_wireguard,with_utls,with_reality,with_clash_api,with_gvisor -o libbox.aar ./experimental/libbox

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: libbox-aar
          path: libbox.aar
