name: Build libbox AAR

on: 
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.21.13'

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Download and Build Engine
        run: |
          # Git ကို မသုံးတော့ဘဲ v1.18.8 Source ကို တိုက်ရိုက်ဆွဲမယ်
          curl -L https://github.com/SagerNet/sing-box/archive/refs/tags/v1.18.8.tar.gz -o source.tar.gz
          tar -xzf source.tar.gz
          
          # Folder နာမည်ကို sing-box လို့ နာမည်ပြောင်းလိုက်မယ်
          mv sing-box-1.18.8 sing-box
          cd sing-box
          
          # gomobile သွင်းမယ်
          go install golang.org/x/mobile/cmd/gomobile@latest
          go install golang.org/x/mobile/cmd/gobind@latest
          export PATH=$PATH:$(go env GOPATH)/bin
          gomobile init
          
          # Build လုပ်မယ်
          gomobile bind -v -target=android -androidapi 21 -javapkg=io.nekohasekai -tags with_quic,with_grpc,with_wireguard,with_utls,with_reality,with_clash_api,with_gvisor -o libbox.aar ./experimental/libbox
          
          # ဖိုင်ကို အပြင်ဘက် ပြန်ထုတ်မယ်
          cp libbox.aar ../

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: libbox-aar
          path: libbox.aar
