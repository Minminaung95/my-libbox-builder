name: Build libbox AAR

on:
  workflow_dispatch:

jobs:
  build-libbox:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout sing-box
        uses: actions/checkout@v4
        with:
          repository: SagerNet/sing-box
          ref: 'v1.18.8' # Hysteria2 အပြည့်အဝပါတဲ့ တည်ငြိမ်တဲ့ Version ပါ
          fetch-depth: 1

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.21.13' # <--- ဒီကောင်က os.checkPidfdOnce Error ကို လုံးဝ ရှင်းပေးမယ့် Version ပါ

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Android NDK
        uses: nttld/setup-ndk@v1
        with:
          ndk-version: r25c

      - name: Install gomobile
        run: |
          go install golang.org/x/mobile/cmd/gomobile@latest
          go install golang.org/x/mobile/cmd/gobind@latest
          export PATH=$PATH:$(go env GOPATH)/bin
          gomobile init
          go get golang.org/x/mobile/bind

      - name: Build libbox.aar
        run: |
          export PATH=$PATH:$(go env GOPATH)/bin
          # Android အတွက် cronet error လည်းကင်းအောင် Tags တွေကို သေချာ စီပေးထားပါတယ်
          gomobile bind -v -target=android -androidapi 21 -javapkg=io.nekohasekai -tags with_quic,with_grpc,with_wireguard,with_utls,with_reality,with_clash_api,with_gvisor -o libbox.aar ./experimental/libbox

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: libbox-aar
          path: libbox.aar # <--- ဖိုင်ကို အပြင်ထုတ်ပေးမယ့် အဆင့်ပါ
