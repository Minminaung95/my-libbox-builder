name: Build libbox AAR

on: 
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Source
        uses: actions/checkout@v4
        with:
          repository: SagerNet/sing-box
          fetch-depth: 1

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.23' # အသစ်ဆုံး Go ကို သုံးပါမယ်

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Build Engine
        run: |
          # gomobile ကို သွင်းပြီး path သတ်မှတ်မယ်
          go install golang.org/x/mobile/cmd/gomobile@latest
          export PATH=$PATH:$(go env GOPATH)/bin
          gomobile init
          
          # androidapi 21 ကနေ 26 ကို တိုးလိုက်ပါတယ် (Hysteria2 အတွက် ပိုတည်ငြိမ်အောင်)
          # with_gvisor ကို ပြန်ထည့်ပေးထားပါတယ်
          gomobile bind -v -target=android -androidapi 26 -javapkg=io.nekohasekai -tags with_quic,with_grpc,with_wireguard,with_utls,with_reality,with_clash_api,with_gvisor -o libbox.aar ./experimental/libbox

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: libbox-aar
          path: libbox.aar
