name: Build libbox AAR

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'sing-box branch or tag (e.g. v1.18.8)'
        required: false
        default: 'v1.18.8' # တည်ငြိမ်တဲ့ Version ကို Default ထားပေးထားပါတယ်

jobs:
  build-libbox:
    name: Build libbox.aar
    runs-on: ubuntu-latest

    steps:
      - name: Checkout sing-box
        uses: actions/checkout@v4
        with:
          repository: SagerNet/sing-box
          ref: ${{ github.event.inputs.version }}
          fetch-depth: 0

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.21.13' # ပိုပြီး တည်ငြိမ်တဲ့ Go ကို သုံးပါမယ်
          cache: true

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Android NDK
        uses: nttld/setup-ndk@v1
        id: setup-ndk
        with:
          ndk-version: r25c # Linker Error မရှိတဲ့ ဗားရှင်းကို ပြောင်းထားပါတယ်
          add-to-path: true

      - name: Install gomobile
        run: |
          go install -v github.com/sagernet/gomobile/cmd/gomobile@v0.1.12
          go install -v github.com/sagernet/gomobile/cmd/gobind@v0.1.12
          export PATH=$PATH:$(go env GOPATH)/bin
          gomobile init

      - name: Build libbox.aar
        env:
          ANDROID_NDK_HOME: ${{ steps.setup-ndk.outputs.ndk-path }}
        run: |
          # အခုနက Error တက်စေတဲ့ cronet ကို tags ထဲမှာ ဖယ်ထုတ်ပြီး Build ပါမယ်
          # ဒါဟာ VPN App အတွက် ဘာမှ မထိခိုက်ပါဘူး
          gomobile bind -v -target=android -androidapi 21 -javapkg=io.nekohasekai -tags with_quic,with_grpc,with_wireguard,with_utls,with_reality,with_clash_api,with_gvisor -o libbox.aar ./experimental/libbox

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: libbox-aar
          path: libbox.aar
