name: Build libbox AAR

on:
  push:
    branches: [ main, testing ]
    tags:
      - 'v*'
  pull_request:
    branches: [ main ]
  workflow_dispatch:
    inputs:
      version:
        description: 'sing-box branch or tag (e.g. v1.18.8), empty = testing branch'
        required: false
        default: 'v1.18.8'

jobs:
  build-libbox:
    name: Build libbox.aar
    runs-on: ubuntu-latest

    steps:
      - name: Checkout sing-box
        uses: actions/checkout@v4
        with:
          repository: SagerNet/sing-box
          ref: ${{ github.event.inputs.version || 'testing' }}
          fetch-depth: 0

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.21.13'
          cache: true

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Android NDK
        uses: nttld/setup-ndk@v1
        id: setup-ndk
        with:
          ndk-version: r25c # Linker Error ကင်းဝေးအောင် r25c ကို သုံးထားပါတယ်
          add-to-path: true

      - name: Install gomobile
        run: |
          go install -v github.com/sagernet/gomobile/cmd/gomobile@v0.1.12
          go install -v github.com/sagernet/gomobile/cmd/gobind@v0.1.12
          export PATH=$PATH:$(go env GOPATH)/bin
          gomobile init

      - name: Install dependencies
        run: |
          go mod download

      - name: Build libbox.aar
        env:
          ANDROID_NDK_HOME: ${{ steps.setup-ndk.outputs.ndk-path }}
        run: |
          export PATH=$PATH:$(go env GOPATH)/bin
          # Error တက်စေတဲ့ cronet ကို ဖယ်ထုတ်ပြီး အစ်ကို့အတွက် အသေချာဆုံး tags တွေနဲ့ build ပါမယ်
          gomobile bind -v -target=android -androidapi 21 -javapkg=io.nekohasekai -tags with_quic,with_grpc,with_wireguard,with_utls,with_reality,with_clash_api,with_gvisor -o libbox.aar ./experimental/libbox

      - name: Move and rename output
        run: |
          mkdir -p output
          # Version နာမည်ယူတဲ့အပိုင်းမှာ အမှားမရှိအောင် သေချာပြင်ထားပါတယ်
          VERSION=${{ github.event.inputs.version }}
          if [ -z "$VERSION" ]; then VERSION="testing"; fi
          mv libbox.aar output/libbox-${VERSION}.aar
          echo "AAR_FILE=output/libbox-${VERSION}.aar" >> $GITHUB_ENV
          echo "VERSION=${VERSION}" >> $GITHUB_ENV

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: libbox-${{ env.VERSION }}
          path: ${{ env.AAR_FILE }}
          retention-days: 30
